name: Build, Verify & Unit Test Firmware

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Host Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Host Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make

      - name: Run Native Unit Tests
        run: |
          make test

  build-avr:
    name: Compile & Verify AVR Firmware
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AVR Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr make

      - name: Verify Toolchain
        run: |
          avr-gcc --version
          make --version

      - name: Strict Build & Verification (-Werror)
        run: |
          make clean
          make verify

      - name: Check Build Outputs
        run: |
          test -f build/program.elf
          test -f build/program.hex
          test -f build/program.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atmega32-firmware
          path: |
            build/*.hex
            build/*.bin
            build/*.elf
            build/*.map
          retention-days: 7
